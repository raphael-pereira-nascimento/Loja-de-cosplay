<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Página não encontrada — CosplayHub">
  <title>404 — Página não encontrada | CosplayHub</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎭</text></svg>">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">

  <header id="site-header"></header>

  <main class="flex-grow-1 container section-padding text-center">

    <div class="py-4">
      <div class="error-code font-display fw-bold text-gradient">404</div>
      <i class="bi bi-emoji-frown display-6 d-block mb-3 mt-n2" style="color:var(--ch-brand-soft)"></i>
      <h1 class="font-display fw-bold h2 mb-2">Essa página fugiu do <span class="text-gradient">mundo real</span></h1>
      <p class="text-muted-2 col-lg-6 mx-auto mb-4">
        O link que você seguiu não existe, mudou de endereço ou foi derrotado em batalha.
        Mas não se preocupe: seus heróis favoritos continuam no catálogo!
      </p>

      <form class="row justify-content-center g-2 mb-4" role="search"
        onsubmit="event.preventDefault();location.href='produtos.html?q='+encodeURIComponent(this.q.value.trim())">
        <div class="col-12 col-sm-8 col-md-6">
          <input type="search" name="q" class="form-control form-control-lg" placeholder="Buscar produtos..." aria-label="Buscar produtos">
        </div>
        <div class="col-auto">
          <button class="btn btn-gradient btn-lg px-4" type="submit"><i class="bi bi-search"></i></button>
        </div>
      </form>

      <div class="d-flex gap-2 justify-content-center flex-wrap mb-5">
        <a href="index.html" class="btn btn-outline-brand px-4"><i class="bi bi-house me-1"></i>Início</a>
        <a href="produtos.html" class="btn btn-outline-brand px-4"><i class="bi bi-grid me-1"></i>Ver catálogo</a>
        <a href="faq.html" class="btn btn-outline-brand px-4"><i class="bi bi-question-circle me-1"></i>Preciso de ajuda</a>
      </div>
    </div>

    <!-- Sugestões -->
    <section class="pb-5">
      <h2 class="font-display fw-bold h4 mb-4">Enquanto isso, dá uma olhada nos <span class="text-gradient">mais vendidos</span></h2>
      <div class="row g-3 g-md-4 row-cols-2 row-cols-md-3 row-cols-xl-4" id="grid-sugestoes"></div>
    </section>

  </main>

  <footer id="site-footer"></footer>
  <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toast-root" style="z-index:1090"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const sugestoes = [...PRODUTOS]
        .sort((a, b) => b.vendas - a.vendas)
        .slice(0, 4);
      document.getElementById("grid-sugestoes").innerHTML =
        sugestoes.map(productCardHTML).join("");
    });
  </script>
</body>
</html>
