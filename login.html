<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Entre na sua conta CosplayHub.">
    <meta property="og:title" content="Login | CosplayHub">
    <meta property="og:description" content="Entre na sua conta CosplayHub.">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="CosplayHub">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Login | CosplayHub">
    <meta name="twitter:description" content="Entre na sua conta CosplayHub.">
  <title>Entrar | CosplayHub</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎭</text></svg>">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="https://live.staticflickr.com">
    <link rel="dns-prefetch" href="https://upload.wikimedia.org">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">

  <header id="site-header"></header>

  <main id="main-content" class="flex-grow-1 container d-flex align-items-center justify-content-center section-padding">

    <div class="col-12 col-md-8 col-lg-5">

      <div class="text-center mb-4">
        <span class="brand-icon mx-auto mb-3" style="width:56px;height:56px;font-size:1.7rem"><i class="bi bi-masks"></i></span>
        <h1 class="font-display fw-bold h3 mb-1">Bem-vindo de <span class="text-gradient">volta!</span></h1>
        <p class="text-muted-2 small">Entre para continuar suas compras.</p>
      </div>

      <div class="filter-card p-4 p-md-5">

        <div class="alert alert-danger d-none align-items-center gap-2 py-2 px-3 small" id="alerta-login" role="alert">
          <i class="bi bi-x-octagon-fill"></i> E-mail ou senha incorretos.
        </div>

        <form id="form-login" novalidate>
          <div class="mb-3">
            <label for="login-email" class="form-label fw-semibold">E-mail</label>
            <div class="input-group has-validation">
              <span class="input-group-text"><i class="bi bi-envelope"></i></span>
              <input type="email" class="form-control" id="login-email" placeholder="voce@email.com" required>
              <div class="invalid-feedback">Informe um e-mail válido.</div>
            </div>
          </div>

          <div class="mb-2">
            <label for="login-senha" class="form-label fw-semibold">Senha</label>
            <div class="input-group has-validation">
              <span class="input-group-text"><i class="bi bi-key"></i></span>
              <input type="password" class="form-control" id="login-senha" placeholder="Sua senha" required minlength="6">
              <button type="button" class="btn btn-outline-brand" id="toggle-senha" aria-label="Mostrar senha">
                <i class="bi bi-eye"></i>
              </button>
              <div class="invalid-feedback">Informe sua senha.</div>
            </div>
          </div>

          <div class="d-flex justify-content-between align-items-center mb-4">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="lembrar-me" checked>
              <label class="form-check-label small text-muted-2" for="lembrar-me">Lembrar de mim</label>
            </div>
            <a href="#" class="small text-decoration-none" style="color:#c4b5fd"
              onclick="showToast('Um link de recuperação foi enviado ao seu e-mail! 📧', 'info'); return false;">
              Esqueci a senha
            </a>
          </div>

          <button type="submit" class="btn btn-gradient btn-lg w-100">
            <i class="bi bi-box-arrow-in-right me-2"></i>Entrar
          </button>

          <div class="bg-surface-2 border-subtle rounded-3 p-3 mt-4 text-center">
            <small class="text-muted-2 d-block mb-1"><i class="bi bi-info-circle me-1"></i>Conta demo para teste:</small>
            <small><strong>demo@demo.com</strong> · senha <strong>123456</strong></small>
          </div>
        </form>
      </div>

      <p class="text-center text-muted-2 small mt-4">
        Ainda não tem conta?
        <a href="cadastro.html" class="fw-semibold text-decoration-none" style="color:#c4b5fd">Cadastre-se grátis</a>
      </p>

    </div>
  </main>

  <footer id="site-footer"></footer>
  <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toast-root" style="z-index:1090"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
