<body class="d-flex flex-column min-vh-100">

  <header id="site-header"></header>

  <main id="main-content" class="flex-grow-1 container section-padding">

    <nav aria-label="breadcrumb">
      <ol class="breadcrumb small">
        <li class="breadcrumb-item"><a href="index.html" class="text-decoration-none text-muted-2">Início</a></li>
        <li class="breadcrumb-item active" aria-current="page">Favoritos</li>
      </ol>
    </nav>

    <div class="d-flex align-items-end justify-content-between mb-4 flex-wrap gap-2">
      <div>
        <h1 class="font-display fw-bold h2 mb-1">
          Meus <span class="text-gradient">favoritos</span> <i class="bi bi-heart-fill text-danger fs-4"></i>
        </h1>
        <p class="text-muted-2 mb-0" id="contador-favs"></p>
      </div>
      <button class="btn btn-outline-brand btn-sm px-3 d-none" id="btn-add-todos-carrinho">

    </div>

    <div class="row g-3 g-md-4 row-cols-2 row-cols-md-3 row-cols-xl-4" id="grid-favoritos"></div>

    <div class="empty-state d-none" id="sem-favoritos">

      <h3 class="font-display">Nenhum favorito ainda</h3>
      <p class="text-muted-2 col-lg-6 mx-auto">

        <i class="bi bi-search me-2"></i>Explorar catálogo
      </a>
    </div>

  <footer id="site-footer"></footer>
  <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toast-root" style="z-index:1090"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
