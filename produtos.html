<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Catálogo completo de cosplays, fantasias e props — filtre por categoria, preço e novidades.">
  <title>Produtos | CosplayHub</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎭</text></svg>">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">

  <header id="site-header"></header>

  <main class="flex-grow-1 container section-padding">

    <nav aria-label="breadcrumb">
      <ol class="breadcrumb small">
        <li class="breadcrumb-item"><a href="index.html" class="text-decoration-none text-muted-2">Início</a></li>
        <li class="breadcrumb-item active" aria-current="page">Produtos</li>
      </ol>
    </nav>

    <div class="d-flex align-items-end justify-content-between flex-wrap gap-2 mb-4">
      <div>
        <h1 class="font-display fw-bold h2 mb-1">Nosso <span class="text-gradient">catálogo</span></h1>
        <p class="text-muted-2 mb-0">Encontre a fantasia perfeita para o seu próximo evento.</p>
      </div>
      <span class="text-muted-2" id="contador-resultados"></span>
    </div>

    <div class="row g-4">

      <!-- ============ FILTROS ============ -->
      <aside class="col-lg-3">
        <button class="btn btn-outline-brand w-100 d-lg-none mb-3" type="button"
          data-bs-toggle="collapse" data-bs-target="#painel-filtros" aria-expanded="false"
          aria-controls="painel-filtros">
          <i class="bi bi-sliders me-2"></i>Filtros
        </button>

        <div class="collapse d-lg-block" id="painel-filtros">
          <div class="filter-card p-4 mb-4">
            <h6 class="fw-bold mb-3"><i class="bi bi-search me-2"></i>Buscar</h6>
            <form id="filtro-busca">
              <input type="search" class="form-control form-control-sm" name="q"
                placeholder="Nome do produto..." aria-label="Buscar no catálogo">
            </form>
          </div>

          <div class="filter-card p-4 mb-4">
            <h6 class="fw-bold mb-3"><i class="bi bi-collection me-2"></i>Categorias</h6>
            <div class="form-check mb-2">
              <input class="form-check-input filtro-cat" type="radio" name="cat" id="cat-todas" value="" checked>
              <label class="form-check-label small" for="cat-todas">Todas as categorias</label>
            </div>
            <div id="lista-categorias"></div>
          </div>

          <div class="filter-card p-4 mb-4">
            <h6 class="fw-bold mb-3"><i class="bi bi-cash-stack me-2"></i>Faixa de preço</h6>
            <div class="form-check mb-2">
              <input class="form-check-input filtro-preco" type="radio" name="preco" id="preco-todos" value="todos" checked>
              <label class="form-check-label small" for="preco-todos">Todos os preços</label>
            </div>
            <div class="form-check mb-2">
              <input class="form-check-input filtro-preco" type="radio" name="preco" id="preco-200" value="ate200">
              <label class="form-check-label small" for="preco-200">Até R$ 200</label>
            </div>
            <div class="form-check mb-2">
              <input class="form-check-input filtro-preco" type="radio" name="preco" id="preco-500" value="ate500">
              <label class="form-check-label small" for="preco-500">R$ 200 a R$ 500</label>
            </div>
            <div class="form-check mb-2">
              <input class="form-check-input filtro-preco" type="radio" name="preco" id="preco-1000" value="ate1000">
              <label class="form-check-label small" for="preco-1000">R$ 500 a R$ 1.000</label>
            </div>
            <div class="form-check">
              <input class="form-check-input filtro-preco" type="radio" name="preco" id="preco-mais" value="mais1000">
              <label class="form-check-label small" for="preco-mais">Acima de R$ 1.000</label>
            </div>
          </div>

          <div class="filter-card p-4 mb-4">
            <h6 class="fw-bold mb-3"><i class="bi bi-rulers me-2"></i>Tamanho</h6>
            <div class="row" id="lista-tamanhos"></div>
          </div>

          <div class="filter-card p-4">
            <h6 class="fw-bold mb-3"><i class="bi bi-tags me-2"></i>Ofertas</h6>
            <div class="form-check form-switch">
              <input class="form-check-input" type="checkbox" role="switch" id="filtro-promo">
              <label class="form-check-label small" for="filtro-promo">Somente em promoção</label>
            </div>
          </div>
        </div>
      </aside>

      <!-- ============ LISTAGEM ============ -->
      <section class="col-lg-9">
        <div class="filter-card p-3 px-md-4 mb-4 d-flex flex-wrap align-items-center justify-content-between gap-3">
          <div class="d-flex align-items-center gap-2 flex-wrap" id="chips-ativos"></div>
          <div class="d-flex align-items-center gap-2 ms-auto">
            <label for="ordenar" class="small text-muted-2 text-nowrap">Ordenar por:</label>
            <select id="ordenar" class="form-select form-select-sm w-auto">
              <option value="relevancia">Relevância</option>
              <option value="menor-preco">Menor preço</option>
              <option value="maior-preco">Maior preço</option>
              <option value="mais-vendidos">Mais vendidos</option>
              <option value="melhor-avaliados">Melhor avaliados</option>
              <option value="novidades">Novidades</option>
            </select>
          </div>
        </div>

        <div class="row g-3 g-md-4 row-cols-2 row-cols-xl-3" id="grid-produtos"></div>

        <div class="empty-state d-none" id="sem-resultados">
          <div class="icon-ring"><i class="bi bi-emoji-frown"></i></div>
          <h4 class="font-display">Nenhum produto encontrado</h4>
          <p class="text-muted-2">Tente ajustar os filtros ou buscar por outro termo.</p>
          <button class="btn btn-gradient px-4 mt-2" onclick="limparFiltros()">
            <i class="bi bi-arrow-counterclockwise me-2"></i>Limpar filtros
          </button>
        </div>
      </section>

    </div>
  </main>

  <footer id="site-footer"></footer>
  <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toast-root" style="z-index:1090"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/produtos.js"></script>
</body>
</html>
